[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-roundtable-local"
version = "0.1.0"
description = "Local, API-free multi-AI roundtable with isolated Edge web providers and offline demos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[project.scripts]
ai-roundtable = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
